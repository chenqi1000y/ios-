name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show workspace
        run: |
          pwd
          ls -la

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Show project and simulators
        run: |
          xcodebuild -list -project LingJu.xcodeproj
          xcrun simctl list devices available

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project LingJu.xcodeproj \
            -scheme LingJu \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "---- xcodebuild errors ----"
          grep -n "error:" xcodebuild.log | head -n 50 || true
          echo "---- xcodebuild warnings ----"
          grep -n "warning:" xcodebuild.log | head -n 50 || true
