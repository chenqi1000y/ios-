name: iOS打包修复版
on:
  push:
    branches: [ main ]

# 强制Node24，彻底消除警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 安装XcodeGen，生成项目文件（你的项目必备）
      - name: 生成Xcode项目
        run: |
          brew install xcodegen
          xcodegen generate

      # 固定命令构建（解决code 65，最稳定）
      - name: 构建模拟器版本
        run: |
          xcodebuild build -project lingju-ios.xcodeproj -scheme lingju-ios -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_IDENTITY="" CODE_SIGNING_ALLOWED=NO

      # 打包并上传
      - name: 打包APP
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r app.zip *.app
      
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/Build/Products/Debug-iphonesimulator/app.zip
