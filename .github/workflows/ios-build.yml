name:  iOS模拟器打包(无Mac测试专用)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建iOS模拟器版本
        run: |
          xcodebuild build \
            -scheme LingJu \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包编译产物
        run: |
          cd ~/Library/Developer/Xcode/DerivedData
          find . -name "LingJu.app" -type d -exec cp -r {} ../ \;
          zip -r ios-simulator-app.zip ../LingJu.app

      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator-app.zip
